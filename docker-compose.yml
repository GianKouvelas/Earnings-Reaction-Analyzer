services:
  db:
    image: postgres:16
    container_name: earnings_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: giannis
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: earnings_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giannis -d earnings_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: earnings_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://giannis:devpassword@db:5432/earnings_analyzer
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://127.0.0.1:8000
    container_name: earnings_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api  

volumes:
  pgdata: